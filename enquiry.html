<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Enquiry</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:760px;margin:35px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:20px;padding:25px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{padding:13px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:13px 18px}.muted{color:#68776f}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div></header><main class="wrap"><section class="panel"><h1>Send Business Enquiry</h1><p id="target" class="muted">Loading…</p><form id="form" class="form"><input id="subject" placeholder="What do you need?" required><textarea id="requirement" rows="5" placeholder="Describe your exact requirement, specifications, delivery expectations, etc." required></textarea><div class="row"><input id="quantity" type="number" step="0.01" placeholder="Quantity"><input id="unit" placeholder="Unit (kg, pieces, tonnes…) "></div><div class="row"><input id="neededBy" type="date"><input id="budget" type="number" step="0.01" placeholder="Budget (₹)"></div><button class="btn">Send Enquiry</button></form><p id="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user;const params=new URLSearchParams(location.search),businessId=params.get('business_id'),productId=params.get('product_id');async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}const {data:b}=await client.from('businesses').select('name').eq('id',businessId).single();target.textContent=b?`Enquiry to ${b.name}`:'Business';}form.onsubmit=async e=>{e.preventDefault();const {error}=await client.from('enquiries').insert({buyer_id:user.id,seller_business_id:businessId,product_service_id:productId||null,subject:subject.value.trim(),requirement:requirement.value.trim(),quantity:quantity.value?Number(quantity.value):null,unit:unit.value.trim()||null,needed_by:neededBy.value||null,budget:budget.value?Number(budget.value):null});status.textContent=error?error.message:'Enquiry sent successfully.';if(!error)e.target.reset()};init();</script></body></html>
