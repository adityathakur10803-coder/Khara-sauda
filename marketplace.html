<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Marketplace</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.links{display:flex;gap:16px}.wrap{max-width:1150px;margin:35px auto;padding:0 18px}.hero{background:#176b4d;color:#fff;border-radius:22px;padding:35px;margin-bottom:22px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}.filters input,.filters select{padding:13px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:12px 17px;cursor:pointer}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}.card{background:#fff;border:1px solid #e0e9e4;border-radius:18px;padding:20px}.card h3{margin:8px 0}.muted{color:#697871;font-size:14px}.badge{display:inline-block;background:#eaf7f0;color:#176b4d;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.price{font-size:20px;font-weight:900;margin:14px 0}.actions{display:flex;gap:8px}.actions .btn{flex:1}.empty{grid-column:1/-1;padding:40px;text-align:center;background:#fff;border-radius:18px}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.results{grid-template-columns:1fr 1fr}}@media(max-width:560px){.filters,.results{grid-template-columns:1fr}.links{display:none}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><div class="links"><a href="dashboard.html">Dashboard</a><a href="connections.html">Connections</a></div></header><main class="wrap"><section class="hero"><h1>Find products, services & business partners</h1><p>Search the Khara Sauda B2B network and connect directly with businesses.</p></section><section class="filters"><input id="q" placeholder="Search product, service or business"><select id="kind"><option value="">Products & Services</option><option value="product">Products</option><option value="service">Services</option></select><input id="location" placeholder="Location"><button class="btn" id="go">Search</button></section><div id="results" class="results"><div class="empty">Loading marketplace…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client;async function init(){client=await loadSupabase();if(!client){results.innerHTML='<div class="empty">Supabase is not configured.</div>';return}search()}async function search(){let query=client.from('products_services').select('id,title,kind,description,price,unit,business_id,businesses(id,name,category,location)').eq('is_active',true).limit(60);const qv=q.value.trim();const lv=location.value.trim();if(kind.value)query=query.eq('kind',kind.value);if(qv)query=query.or(`title.ilike.%${qv}%,description.ilike.%${qv}%`);const {data,error}=await query;if(error){results.innerHTML='<div class="empty">'+error.message+'</div>';return}const filtered=(data||[]).filter(x=>!lv||(x.businesses?.location||'').toLowerCase().includes(lv.toLowerCase())||(x.businesses?.name||'').toLowerCase().includes(lv.toLowerCase()));results.innerHTML=filtered.length?filtered.map(x=>`<article class="card"><span class="badge">${x.kind}</span><h3>${x.title}</h3><p class="muted">${x.businesses?.name||'Business'} · ${x.businesses?.category||''}</p><p class="muted">${x.businesses?.location||'Location not listed'}</p><p>${x.description||'No description provided.'}</p><div class="price">${x.price==null?'Price on enquiry':'₹'+Number(x.price).toLocaleString('en-IN')+(x.unit?' / '+x.unit:'')}</div><div class="actions"><a class="btn" href="business.html?id=${x.business_id}">View business</a><a class="btn" href="enquiry.html?business_id=${x.business_id}&product_id=${x.id}">Enquire</a></div></article>`).join(''):'<div class="empty">No matching products or services found.</div>'}go.onclick=search;q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});init();</script></body></html>
