<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Dashboard</title><style>:root{--g:#176b4d;--dark:#10231d;--bg:#f5f8f6;--muted:#66766f}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--dark)}header{height:70px;background:#fff;border-bottom:1px solid #e1e9e5;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-size:24px;font-weight:900}.brand span{color:var(--g)}.user{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#dff1e7;display:grid;place-items:center;font-weight:800;color:var(--g)}main{padding:35px 5%;max-width:1300px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:end;gap:20px}.welcome h1{margin:0;font-size:34px}.welcome p{color:var(--muted)}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.layout{display:grid;grid-template-columns:220px 1fr;gap:25px;margin-top:30px}.side{background:#fff;border:1px solid #e2e9e5;border-radius:18px;padding:15px;height:max-content}.side button{width:100%;text-align:left;background:none;border:0;padding:13px;border-radius:9px;font-weight:700;color:#50615a;cursor:pointer}.side button.active,.side button:hover{background:#eaf7f0;color:var(--g)}.content{min-width:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.panel{background:#fff;border:1px solid #e2e9e5;border-radius:18px;padding:20px}.stat strong{display:block;font-size:28px;color:var(--g)}.stat small{color:var(--muted)}.panel{margin-top:20px}.panel h2{font-size:20px;margin:0 0 18px}.search{display:flex;gap:10px;margin-bottom:15px}.search input,.search select{width:100%;padding:13px;border:1px solid #d6e0db;border-radius:10px;background:#fff}.biz{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid #edf1ef}.bizicon{width:46px;height:46px;border-radius:13px;background:#eaf7f0;display:grid;place-items:center;font-size:22px}.biz h3{margin:0 0 4px;font-size:16px}.biz p{margin:0;color:var(--muted);font-size:13px}.connect{margin-left:auto;border:1px solid #bcd6c9;background:#fff;color:var(--g);border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer}.deal{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1ef;padding:14px 0}.badge{padding:5px 9px;border-radius:20px;background:#fff3d6;color:#8a5d00;font-size:12px;font-weight:800}.notice{margin-top:15px;color:var(--muted);font-size:13px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.welcome{display:block}}@media(max-width:500px){main{padding:25px 4%}.stats{grid-template-columns:1fr}.search{display:block}.search>*{margin-bottom:8px}}</style></head><body><header><div class="brand">Khara <span>Sauda</span></div><div class="user"><span id="email">Loading…</span><div class="avatar">KS</div><button class="btn" id="logout">Logout</button></div></header><main><div class="welcome"><div><h1 id="title">Business Dashboard</h1><p>Manage your network, opportunities and deals.</p></div></div><div class="layout"><aside class="side"><button class="active">▦ Overview</button><button onclick="document.getElementById('discover').scrollIntoView()">⌕ Find Businesses</button><button>♧ Connections</button><button>✉ Messages</button><button>◆ Deals</button><button>⚙ Settings</button></aside><section class="content"><div class="stats"><div class="stat"><strong id="connections">0</strong><small>Connections</small></div><div class="stat"><strong id="enquiries">0</strong><small>Messages</small></div><div class="stat"><strong id="deals">0</strong><small>Deals</small></div><div class="stat"><strong id="profileStatus">—</strong><small>Profile</small></div></div><div class="panel"><h2>My Business</h2><div id="profile">Loading…</div></div><div class="panel" id="discover"><h2>Find businesses</h2><div class="search"><input id="q" placeholder="Search business, industry or location"><select id="cat"><option value="">All industries</option><option>Manufacturing</option><option>Distribution</option><option>Retail</option><option>Food & Agriculture</option><option>Technology</option><option>Logistics</option></select></div><div id="list">Loading…</div><div class="notice" id="notice"></div></div><div class="panel"><h2>Recent deals</h2><div id="dealList" class="muted">No deals yet.</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>
let client,user;const q=document.getElementById('q'),cat=document.getElementById('cat');
async function init(){client=await loadSupabase();if(!client){document.getElementById('title').textContent='Supabase not configured';return}const auth=await client.auth.getUser();user=auth.data.user;if(!user){location.href='index.html';return}document.getElementById('email').textContent=user.email||'';const {data:b}=await client.from('businesses').select('*').eq('owner_id',user.id).maybeSingle();document.getElementById('title').textContent=`Welcome, ${b?.name||'Business'}`;document.getElementById('profileStatus').textContent=b?'Complete':'Missing';document.getElementById('profile').innerHTML=b?`<strong>${b.name}</strong><p>${b.category||''} · ${b.location||'Location not listed'}</p><p>${b.description||'Add a description to help businesses discover you.'}</p>`:'Create your business profile to join the network.';await refreshStats();await searchBusinesses()}
async function refreshStats(){const uid=user.id;const {count:c}=await client.from('connections').select('*',{count:'exact',head:true}).or(`requester_id.eq.${uid},recipient_id.eq.${uid}`);const {count:m}=await client.from('messages').select('*',{count:'exact',head:true}).eq('sender_id',uid);const {count:d}=await client.from('deals').select('*',{count:'exact',head:true}).eq('created_by',uid);connections.textContent=c||0;enquiries.textContent=m||0;deals.textContent=d||0}
async function searchBusinesses(){if(!client)return;let query=client.from('businesses').select('id,owner_id,name,category,location,description').neq('owner_id',user.id).limit(30);const s=q.value.trim();if(s)query=query.or(`name.ilike.%${s}%,category.ilike.%${s}%,location.ilike.%${s}%,description.ilike.%${s}%`);if(cat.value)query=query.eq('category',cat.value);const {data,error}=await query;if(error){list.textContent=error.message;return}list.innerHTML=data?.length?data.map(b=>`<div class="biz"><div class="bizicon">🏢</div><div><h3>${escapeHtml(b.name)}</h3><p>${escapeHtml(b.category||'')} · ${escapeHtml(b.location||'')}</p></div><button class="connect" onclick="connect('${b.owner_id}')">Connect</button></div>`).join(''):'<p>No businesses found.</p>'}
async function connect(recipient){notice.textContent='';try{await sendConnection(recipient);notice.textContent='Connection request sent.';await refreshStats()}catch(e){notice.textContent=e.message}}
function escapeHtml(x){return String(x||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
q.oninput=searchBusinesses;cat.onchange=searchBusinesses;logout.onclick=async()=>{await signOutBusiness();location.href='index.html'};init();
</script></body></html>
