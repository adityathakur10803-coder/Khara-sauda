<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — My Enquiries</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:950px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:18px;padding:22px}.item{padding:18px 0;border-bottom:1px solid #edf1ef}.item:last-child{border:0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eaf7f0;color:#176b4d;font-size:11px;font-weight:800}.muted{color:#68776f;font-size:13px}.btn{display:inline-block;background:#176b4d;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;margin-top:10px}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="dashboard.html">Dashboard</a></header><main class="wrap"><section class="panel"><h1>My Enquiries</h1><div id="list">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user;async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='auth.html';return}const {data,error}=await client.from('enquiries').select('*,businesses!seller_business_id(name),products_services(title)').eq('buyer_id',user.id).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=data?.length?data.map(x=>`<article class="item"><h3>${escapeHtml(x.subject)}</h3><p class="muted">To: ${escapeHtml(x.businesses?.name||'Business')} · ${escapeHtml(x.products_services?.title||'General enquiry')}</p><span class="badge">${x.status}</span><p>${escapeHtml(x.requirement)}</p>${x.seller_response?`<p><strong>Seller response:</strong> ${escapeHtml(x.seller_response)}</p>`:''}${x.status==='accepted'?`<a class="btn" href="deal-from-enquiry.html?id=${x.id}">Open deal conversion</a>`:''}</article>`).join(''):'You have not sent any enquiries yet.'}function escapeHtml(x){return String(x||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}init();</script></body></html>
