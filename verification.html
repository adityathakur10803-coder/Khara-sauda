<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Verification</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:720px;margin:45px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e1e9e4;border-radius:20px;padding:28px}.form{display:grid;gap:14px}.form input,.form textarea{padding:13px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:13px 18px}.status{padding:12px;background:#eaf7f0;border-radius:10px}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div></header><main class="wrap"><section class="panel"><h1>Business Verification</h1><p>Submit your business for review. Verified businesses can display a trust badge after an authorised review.</p><form id="form" class="form"><input id="note" placeholder="Business registration / verification details" required><textarea id="details" rows="5" placeholder="Add relevant business details for the reviewer" required></textarea><button class="btn">Submit for verification</button></form><div id="status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user,business;async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}const r=await client.from('businesses').select('id').eq('owner_id',user.id).single();business=r.data}form.onsubmit=async e=>{e.preventDefault();const {error}=await client.from('business_verifications').upsert({business_id:business.id,status:'pending',reviewer_note:note.value+'\n'+details.value},{onConflict:'business_id'});status.className='status';status.textContent=error?error.message:'Verification request submitted.'};init();</script></body></html>
