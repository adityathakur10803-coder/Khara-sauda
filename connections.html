<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Connections</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{padding:11px 15px;border:1px solid #d7e1dc;border-radius:10px;background:#fff;cursor:pointer}.tab.active{background:#176b4d;color:#fff}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{background:#fff;border:1px solid #e1e9e4;border-radius:18px;padding:18px}.person{padding:14px;border-bottom:1px solid #edf1ef;cursor:pointer}.person strong{display:block}.person small{color:#6b7973}.chat{min-height:500px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:10px}.msg{max-width:75%;padding:10px 13px;border-radius:13px;background:#eef4f1;margin:8px 0}.mine{margin-left:auto;background:#176b4d;color:#fff}.composer{display:flex;gap:8px;border-top:1px solid #edf1ef;padding-top:14px}.composer input{flex:1;padding:13px;border:1px solid #ccd8d2;border-radius:10px}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:12px 16px}@media(max-width:760px){.layout{grid-template-columns:1fr}.chat{min-height:420px}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="dashboard.html">Dashboard</a></header><main class="wrap"><div class="tabs"><button class="tab active" id="accepted">Connections</button><button class="tab" id="pending">Pending</button></div><div class="layout"><section class="panel"><div id="people">Loading…</div></section><section class="panel chat"><h2 id="title">Select a connection</h2><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="body" placeholder="Write a message…" autocomplete="off" required><button class="btn">Send</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user,current=null;async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}await loadConnections();}async function loadConnections(mode='accepted'){const status=mode==='pending'?'pending':'accepted';const {data,error}=await client.from('connections').select('id,requester_id,recipient_id,status').eq('status',status).or(`requester_id.eq.${user.id},recipient_id.eq.${user.id}`);if(error){people.textContent=error.message;return}people.innerHTML=data?.length?data.map(c=>`<div class="person" onclick="openChat('${c.id}')"><strong>Business connection</strong><small>${c.requester_id===user.id?'Outgoing':'Incoming'} · ${c.status}</small></div>`).join(''):'No connections yet.'}async function openChat(id){current=id;title.textContent='Business chat';await loadMessages();const channel=client.channel('chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'connection_id=eq.'+id},payload=>{if(payload.new.sender_id!==user.id)addMessage(payload.new)}).subscribe();}async function loadMessages(){const {data,error}=await client.from('messages').select('*').eq('connection_id',current).order('created_at');messages.innerHTML=error?error.message:'';(data||[]).forEach(addMessage)}function addMessage(m){const d=document.createElement('div');d.className='msg '+(m.sender_id===user.id?'mine':'');d.textContent=m.body;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}composer.onsubmit=async e=>{e.preventDefault();if(!current)return alert('Select a connection first.');try{await sendMessage(current,body.value.trim());body.value='';await loadMessages()}catch(err){alert(err.message)}};accepted.onclick=()=>{pending.classList.remove('active');accepted.classList.add('active');loadConnections('accepted')};pending.onclick=()=>{accepted.classList.remove('active');pending.classList.add('active');loadConnections('pending')};init();</script></body></html>
