<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Catalog</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e1e9e4;border-radius:18px;padding:22px;margin-bottom:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form textarea{grid-column:1/-1}.form input,.form textarea,.form select{padding:13px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:12px 16px}.item{padding:16px 0;border-bottom:1px solid #edf1ef}.item:last-child{border:0}.badge{font-size:12px;font-weight:800;background:#eaf7f0;color:#176b4d;padding:5px 9px;border-radius:99px}@media(max-width:700px){.form{grid-template-columns:1fr}.form textarea{grid-column:auto}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="dashboard.html">Dashboard</a></header><main class="wrap"><section class="panel"><h1>My Products & Services</h1><form id="form" class="form"><input id="title" placeholder="Product/service name" required><select id="kind"><option value="product">Product</option><option value="service">Service</option></select><input id="price" type="number" step="0.01" placeholder="Price (optional)"><input id="unit" placeholder="Unit e.g. piece, kg, project"><textarea id="description" rows="3" placeholder="Description"></textarea><button class="btn">Add to catalog</button></form><p id="status"></p></section><section class="panel"><h2>Catalog</h2><div id="list">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user,business;async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}const r=await client.from('businesses').select('id').eq('owner_id',user.id).single();business=r.data;if(!business){list.textContent='Create a business profile first.';return}load()}async function load(){const {data,error}=await client.from('products_services').select('*').eq('business_id',business.id).order('created_at',{ascending:false});list.innerHTML=error?error.message:(data?.length?data.map(x=>`<div class="item"><strong>${x.title}</strong> <span class="badge">${x.kind}</span><p>${x.description||''}</p><small>${x.price==null?'Price on enquiry':'₹'+Number(x.price).toLocaleString('en-IN')+(x.unit?' / '+x.unit:'')}</small></div>`).join(''):'No products or services listed yet.'}form.onsubmit=async e=>{e.preventDefault();status.textContent='';const {error}=await client.from('products_services').insert({business_id:business.id,title:title.value.trim(),kind:kind.value,price:price.value?Number(price.value):null,unit:unit.value.trim()||null,description:description.value.trim()});status.textContent=error?error.message:'Added to catalog.';if(!error){e.target.reset();load()}};init();</script></body></html>
