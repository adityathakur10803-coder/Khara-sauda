<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Enquiries</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:18px;padding:18px}.row{padding:14px;border-bottom:1px solid #edf1ef;cursor:pointer}.row:last-child{border:0}.row strong{display:block}.muted{color:#68776f;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eaf7f0;color:#176b4d;font-size:11px;font-weight:800}.detail p{line-height:1.55}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:11px 15px;cursor:pointer}.btn.alt{background:#eef4f1;color:#176b4d}.form{display:grid;gap:10px;margin-top:18px}.form textarea{padding:12px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="dashboard.html">Dashboard</a></header><main class="wrap"><div class="grid"><section class="panel"><h2>Incoming Enquiries</h2><div id="list">Loading…</div></section><section class="panel detail" id="detail"><h2>Select an enquiry</h2><p class="muted">Incoming buyer requirements will appear here.</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user,business,enquiries=[];async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='auth.html';return}const b=await client.from('businesses').select('id,name').eq('owner_id',user.id).single();business=b.data;if(!business){list.textContent='Create a business profile first.';return}load()}async function load(){const {data,error}=await client.from('enquiries').select('*,products_services(title)').eq('seller_business_id',business.id).order('created_at',{ascending:false});enquiries=data||[];list.innerHTML=error?error.message:(enquiries.length?enquiries.map((x,i)=>`<div class="row" onclick="show(${i})"><strong>${escapeHtml(x.subject)}</strong><span class="muted">${escapeHtml(x.products_services?.title||'General enquiry')} · ${new Date(x.created_at).toLocaleDateString('en-IN')}</span><br><span class="badge">${x.status}</span></div>`).join(''):'No enquiries yet.')}function show(i){const x=enquiries[i];detail.innerHTML=`<h2>${escapeHtml(x.subject)}</h2><span class="badge">${x.status}</span><p><strong>Requirement</strong><br>${escapeHtml(x.requirement)}</p><p><strong>Quantity</strong><br>${x.quantity||'Not specified'} ${escapeHtml(x.unit||'')}</p><p><strong>Needed by</strong><br>${x.needed_by||'Not specified'}</p><p><strong>Budget</strong><br>${x.budget==null?'Not specified':'₹'+Number(x.budget).toLocaleString('en-IN')}</p>${x.seller_response?`<p><strong>Your response</strong><br>${escapeHtml(x.seller_response)}</p>`:''}<div class="actions"><button class="btn" onclick="updateStatus('${x.id}','responded')">Respond</button><button class="btn" onclick="updateStatus('${x.id}','negotiating')">Negotiate</button><button class="btn" onclick="updateStatus('${x.id}','accepted')">Accept</button><button class="btn alt" onclick="updateStatus('${x.id}','rejected')">Reject</button>${x.status==='accepted'?`<a class="btn" href="deal-from-enquiry.html?id=${x.id}">Create Deal</a>`:''}</div><form class="form" onsubmit="sendResponse(event,'${x.id}')"><textarea id="response" rows="4" placeholder="Write your response to the buyer"></textarea><button class="btn">Send Response</button></form>`}async function updateStatus(id,statusValue){const {error}=await client.from('enquiries').update({status:statusValue}).eq('id',id);if(error){alert(error.message);return}await load();const i=enquiries.findIndex(x=>x.id===id);if(i>=0)show(i)}async function sendResponse(e,id){e.preventDefault();const text=document.getElementById('response').value.trim();if(!text)return;const {error}=await client.from('enquiries').update({seller_response:text,status:'responded'}).eq('id',id);if(error){alert(error.message);return}await load();show(enquiries.findIndex(x=>x.id===id))}function escapeHtml(x){return String(x||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}init();</script></body></html>
