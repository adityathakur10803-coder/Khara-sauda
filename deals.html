<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Deals</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e1e9e4;border-radius:18px;padding:22px}.deal{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:17px 0;border-bottom:1px solid #edf1ef}.deal:last-child{border:0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eaf7f0;color:#176b4d;font-size:11px;font-weight:800}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:10px 14px}.muted{color:#68776f;font-size:13px}@media(max-width:650px){.deal{display:block}.deal .btn{margin-top:10px}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="dashboard.html">Dashboard</a></header><main class="wrap"><section class="panel"><h1>My Deals</h1><p class="muted">Only deals you are a participant in are returned by Supabase RLS.</p><div id="list">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user;async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}load()}async function load(){const {data,error}=await client.from('deals').select('id,title,value,status,created_at,seller_business_id,businesses(name)').order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=data?.length?data.map(d=>`<div class="deal"><div><strong>${d.title}</strong><br><span class="muted">${d.businesses?.name||'Business'} · ₹${Number(d.value||0).toLocaleString('en-IN')} · ${new Date(d.created_at).toLocaleDateString('en-IN')}</span><br><span class="badge">${d.status}</span></div><a href="deal.html?id=${d.id}"><button class="btn">Open deal</button></a></div>`).join(''):'No deals yet.'}init();</script></body></html>
