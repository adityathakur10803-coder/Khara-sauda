<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Deals</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e1e9e4;border-radius:18px;padding:22px;margin-bottom:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form textarea{grid-column:1/-1}.form input,.form textarea,.form select{padding:13px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:12px 16px}.deal{padding:15px 0;border-bottom:1px solid #edf1ef}.deal:last-child{border:0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eaf7f0;color:#176b4d;font-size:12px;font-weight:800}@media(max-width:700px){.form{grid-template-columns:1fr}.form textarea{grid-column:auto}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="dashboard.html">Dashboard</a></header><main class="wrap"><section class="panel"><h1>Create a Deal</h1><form id="dealForm" class="form"><input id="connection" placeholder="Connection ID" required><input id="title" placeholder="Deal title" required><input id="value" type="number" step="0.01" placeholder="Value (₹)"><textarea id="description" rows="4" placeholder="Deal details"></textarea><button class="btn">Create Deal</button></form><p id="status"></p></section><section class="panel"><h2>My Deals</h2><div id="list">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user;async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}loadDeals()}async function loadDeals(){const {data,error}=await client.from('deals').select('*').order('created_at',{ascending:false});list.innerHTML=error?error.message:(data?.length?data.map(d=>`<div class="deal"><strong>${d.title}</strong> <span class="badge">${d.status}</span><p>${d.description||''}</p><small>₹${Number(d.value||0).toLocaleString('en-IN')}</small></div>`).join(''):'No deals yet.'}dealForm.onsubmit=async e=>{e.preventDefault();status.textContent='';const {data,error}=await client.from('deals').insert({connection_id:connection.value.trim(),created_by:user.id,title:title.value.trim(),description:description.value.trim(),value:value.value?Number(value.value):null}).select().single();if(error){status.textContent=error.message;return}status.textContent='Deal created.';e.target.reset();loadDeals()};init();</script></body></html>
