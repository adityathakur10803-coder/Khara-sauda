<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Business</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:1050px;margin:35px auto;padding:0 18px}.hero,.panel{background:#fff;border:1px solid #e0e9e4;border-radius:20px;padding:25px;margin-bottom:18px}.hero{background:#176b4d;color:#fff}.badge{display:inline-block;padding:6px 10px;border-radius:99px;background:#eaf7f0;color:#176b4d;font-size:12px;font-weight:800}.hero .badge{color:#176b4d}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.item{padding:15px 0;border-bottom:1px solid #edf1ef}.item:last-child{border:0}.muted{color:#68776f}.hero .muted{color:#d9eee5}.btn{border:0;border-radius:10px;padding:12px 17px;background:#fff;color:#176b4d;font-weight:900;cursor:pointer}.btn.dark{background:#176b4d;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="marketplace.html">Marketplace</a></header><main class="wrap"><section id="hero" class="hero">Loading business…</section><div class="grid"><section class="panel"><h2>Products & Services</h2><div id="catalog">Loading…</div></section><aside class="panel"><h2>Business details</h2><div id="details"></div><hr><div class="actions"><button id="connect" class="btn dark">Connect</button><button id="message" class="btn dark">Message</button></div><p id="status" class="muted"></p></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,business;const id=new URLSearchParams(location.search).get('id');async function init(){client=await loadSupabase();if(!client||!id){hero.textContent='Business not found.';return}const r=await client.from('businesses').select('*').eq('id',id).single();if(r.error){hero.textContent='Business not found.';return}business=r.data;const v=await client.from('business_verifications').select('status').eq('business_id',id).maybeSingle();hero.innerHTML=`<h1>${business.name}</h1><p class="muted">${business.category} · ${business.location||'Location not listed'}</p>${v.data?.status==='verified'?'<span class="badge">✓ Verified business</span>':''}<p>${business.description||'No business description provided.'}</p>`;details.innerHTML=`<p><strong>Industry</strong><br>${business.category}</p><p><strong>Location</strong><br>${business.location||'Not listed'}</p><p><strong>Contact</strong><br>${business.phone||'Available after connection'}</p>`;const c=await client.from('products_services').select('*').eq('business_id',id).eq('is_active',true).order('created_at',{ascending:false});catalog.innerHTML=c.data?.length?c.data.map(x=>`<div class="item"><strong>${x.title}</strong> <span class="badge">${x.kind}</span><p>${x.description||''}</p><small>${x.price==null?'Price on enquiry':'₹'+Number(x.price).toLocaleString('en-IN')+(x.unit?' / '+x.unit:'')}</small></div>`).join(''):'No active products or services listed.'}async function request(){const s=await client.auth.getUser();if(!s.data.user){location.href='index.html';return}try{await sendConnection(business.owner_id);status.textContent='Connection request sent.'}catch(e){status.textContent=e.message}}connect.onclick=request;message.onclick=()=>{location.href='connections.html'};init();</script></body></html>
