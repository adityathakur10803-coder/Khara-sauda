<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Sign in</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(520px,100%);background:#fff;border:1px solid #e0e9e4;border-radius:22px;padding:28px;box-sizing:border-box}.brand{font-size:26px;font-weight:900}.brand b{color:#176b4d}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1;padding:11px;border:1px solid #ccd8d2;border-radius:10px;background:#fff;font-weight:800}.tabs .active{background:#176b4d;color:#fff}.form{display:grid;gap:11px}.form input{padding:13px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:13px;cursor:pointer}.hidden{display:none}.muted{color:#68776f;font-size:14px}.status{margin-top:14px;padding:11px;border-radius:10px;background:#eef7f2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="box"><div class="brand">Khara <b>Sauda</b></div><p class="muted">Join the B2B network and start doing business directly.</p><div class="tabs"><button id="loginTab" class="active">Sign in</button><button id="signupTab">Create account</button></div><form id="loginForm" class="form"><input id="loginEmail" type="email" placeholder="Business email" required><input id="loginPassword" type="password" placeholder="Password" required><button class="btn">Sign in</button></form><form id="signupForm" class="form hidden"><input id="name" placeholder="Business name" required><div class="grid"><input id="category" placeholder="Industry" required><input id="location" placeholder="City / State"></div><input id="description" placeholder="Short business description"><input id="email" type="email" placeholder="Business email" required><input id="password" type="password" minlength="6" placeholder="Password (6+ characters)" required><button class="btn">Create business account</button></form><div id="status"></div><p><a href="index.html">← Back to Khara Sauda</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client;const loginTab=document.querySelector('#loginTab'),signupTab=document.querySelector('#signupTab'),loginForm=document.querySelector('#loginForm'),signupForm=document.querySelector('#signupForm'),status=document.querySelector('#status');function tab(signup){loginTab.classList.toggle('active',!signup);signupTab.classList.toggle('active',signup);loginForm.classList.toggle('hidden',signup);signupForm.classList.toggle('hidden',!signup)}loginTab.onclick=()=>tab(false);signupTab.onclick=()=>tab(true);async function init(){client=await loadSupabase();if(!client){status.textContent='Add your Supabase URL and publishable key in config.js before using authentication.';return}const s=await client.auth.getSession();if(s.data.session)location.href='dashboard.html'}loginForm.onsubmit=async e=>{e.preventDefault();if(!client)return;status.textContent='Signing in…';const {error}=await client.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){status.textContent=error.message;return}location.href='dashboard.html'};signupForm.onsubmit=async e=>{e.preventDefault();if(!client)return;status.textContent='Creating account…';try{const data=await signUpBusiness({email:email.value.trim(),password:password.value,name:name.value.trim(),category:category.value.trim(),location:location.value.trim(),description:description.value.trim()});status.textContent=data.session?'Account created.':'Account created. Check your email if confirmation is enabled.';if(data.session)location.href='dashboard.html'}catch(err){status.textContent=err.message}};init();</script></body></html>
