<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Convert Enquiry</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;border-bottom:1px solid #e4ebe4}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:760px;margin:35px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:20px;padding:25px}.form{display:grid;gap:12px}.form input,.form textarea{padding:13px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:13px 18px;cursor:pointer}.muted{color:#68776f}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div></header><main class="wrap"><section class="panel"><h1>Convert Enquiry to Deal</h1><p id="info" class="muted">Loading…</p><form id="form" class="form"><input id="title" placeholder="Deal title" required><input id="value" type="number" step="0.01" placeholder="Agreed value (₹)" required><textarea id="description" rows="4" placeholder="Agreed terms / delivery details"></textarea><button class="btn">Create Deal</button></form><p id="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user,enquiry;const enquiryId=new URLSearchParams(location.search).get('id');async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='auth.html';return}const r=await client.from('enquiries').select('*,businesses!seller_business_id(owner_id,name)').eq('id',enquiryId).single();enquiry=r.data;if(r.error||!enquiry){info.textContent=r.error?.message||'Enquiry not found.';form.style.display='none';return}if(enquiry.buyer_id!==user.id&&enquiry.businesses?.owner_id!==user.id){info.textContent='You are not a participant in this enquiry.';form.style.display='none';return}info.textContent=`${enquiry.subject} · ${enquiry.businesses?.name||'Business'} · Requested ${enquiry.quantity||'unspecified'} ${enquiry.unit||''}`;title.value=enquiry.subject;value.value=enquiry.budget||'';description.value=enquiry.requirement||''}form.onsubmit=async e=>{e.preventDefault();status.textContent='Creating deal…';const sellerOwner=enquiry.businesses.owner_id;let conn=await client.from('connections').select('id').or(`and(requester_id.eq.${enquiry.buyer_id},recipient_id.eq.${sellerOwner}),and(requester_id.eq.${sellerOwner},recipient_id.eq.${enquiry.buyer_id})`).limit(1).maybeSingle();let connectionId=conn.data?.id;if(!connectionId){const requester=enquiry.buyer_id;const recipient=sellerOwner;const c=await client.from('connections').insert({requester_id:requester,recipient_id:recipient,status:'accepted'}).select('id').single();if(c.error){status.textContent=c.error.message;return}connectionId=c.data.id}const {data,error}=await client.from('deals').insert({connection_id:connectionId,enquiry_id:enquiry.id,buyer_id:enquiry.buyer_id,seller_business_id:enquiry.seller_business_id,created_by:user.id,title:title.value.trim(),description:description.value.trim(),value:Number(value.value),status:'proposed'}).select().single();if(error){status.textContent=error.message;return}await client.from('enquiries').update({status:'accepted'}).eq('id',enquiry.id);status.textContent='Deal created. Both businesses can now manage it.';setTimeout(()=>location.href='deal.html?id='+data.id,600)};init();</script></body></html>
