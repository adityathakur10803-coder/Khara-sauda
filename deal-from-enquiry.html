<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Convert Enquiry</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:760px;margin:35px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:20px;padding:25px}.form{display:grid;gap:12px}.form input,.form textarea{padding:13px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:13px 18px}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div></header><main class="wrap"><section class="panel"><h1>Convert Enquiry to Deal</h1><p id="info">Loading…</p><form id="form" class="form"><input id="title" placeholder="Deal title" required><input id="value" type="number" step="0.01" placeholder="Agreed value (₹)" required><textarea id="description" rows="4" placeholder="Agreed terms / delivery details"></textarea><button class="btn">Create Deal</button></form><p id="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user,enquiry;const enquiryId=new URLSearchParams(location.search).get('id');async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}const r=await client.from('enquiries').select('*').eq('id',enquiryId).single();enquiry=r.data;if(r.error||!enquiry){info.textContent='Enquiry not found.';form.style.display='none';return}info.textContent=`${enquiry.subject} · Requested ${enquiry.quantity||'unspecified'} ${enquiry.unit||''}`;title.value=enquiry.subject;value.value=enquiry.budget||'';description.value=enquiry.requirement||''}form.onsubmit=async e=>{e.preventDefault();const {data,error}=await client.from('deals').insert({connection_id:null,enquiry_id:enquiry.id,created_by:user.id,title:title.value.trim(),description:description.value.trim(),value:Number(value.value),status:'proposed'}).select().single();if(error){status.textContent=error.message;return}await client.from('enquiries').update({status:'accepted'}).eq('id',enquiry.id);status.textContent='Deal created from enquiry.'};init();</script></body></html>
