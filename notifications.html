<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Notifications</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:800px;margin:35px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:18px;padding:20px}.note{padding:16px;border-bottom:1px solid #edf1ef}.note.unread{background:#eef7f2}.muted{color:#68776f;font-size:13px}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:10px 14px}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="dashboard.html">Dashboard</a></header><main class="wrap"><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h1>Notifications</h1><button class="btn" id="read">Mark all read</button></div><div id="list">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user;async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}load();client.channel('notifications').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},()=>load()).subscribe()}async function load(){const {data,error}=await client.from('notifications').select('*').order('created_at',{ascending:false}).limit(100);list.innerHTML=error?error.message:(data?.length?data.map(n=>`<div class="note ${n.is_read?'':'unread'}"><strong>${n.title}</strong><p>${n.body||''}</p><span class="muted">${new Date(n.created_at).toLocaleString('en-IN')}</span></div>`).join(''):'No notifications yet.')}read.onclick=async()=>{await client.from('notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);load()};init();</script></body></html>
