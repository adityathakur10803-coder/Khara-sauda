<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Admin</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:18px;padding:22px;margin-bottom:18px}.item{padding:15px 0;border-bottom:1px solid #edf1ef}.badge{padding:5px 9px;border-radius:99px;background:#eaf7f0;color:#176b4d;font-size:11px;font-weight:800}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:9px;padding:9px 13px;margin:5px}.muted{color:#68776f;font-size:13px}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b> Admin</div></header><main class="wrap"><section class="panel"><h1>Dispute Management</h1><div id="disputes">Loading…</div></section><section class="panel"><h2>Audit Log</h2><div id="audit">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client;async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();if(!s.data.user){location.href='index.html';return}const a=await client.from('admin_users').select('user_id').eq('user_id',s.data.user.id).maybeSingle();if(!a.data){document.querySelector('main').innerHTML='<section class="panel"><h1>Access denied</h1><p>You are not an authorized Khara Sauda administrator.</p></section>';return}load()}async function load(){const d=await client.from('disputes').select('*').order('created_at',{ascending:false});disputes.innerHTML=d.error?d.error.message:(d.data?.length?d.data.map(x=>`<div class="item"><strong>${x.reason}</strong> <span class="badge">${x.status}</span><p>${x.description}</p><p class="muted">Deal: ${x.deal_id} · ${new Date(x.created_at).toLocaleString('en-IN')}</p><button class="btn" onclick="resolve('${x.id}','under_review')">Review</button><button class="btn" onclick="resolve('${x.id}','resolved_buyer')">Resolve buyer</button><button class="btn" onclick="resolve('${x.id}','resolved_seller')">Resolve seller</button><button class="btn" onclick="resolve('${x.id}','closed')">Close</button></div>`).join(''):'No disputes.');const l=await client.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(100);audit.innerHTML=l.error?l.error.message:(l.data?.length?l.data.map(x=>`<div class="item"><strong>${x.action}</strong><p class="muted">${x.entity_type} · ${x.entity_id||''} · ${new Date(x.created_at).toLocaleString('en-IN')}</p></div>`).join(''):'No audit entries.')}async function resolve(id,status){const {error}=await client.from('disputes').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}init();</script></body></html>
