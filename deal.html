<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khara Sauda — Deal</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#10231d}.top{background:#fff;padding:18px 6%;border-bottom:1px solid #e4ebe7}.brand{font-size:24px;font-weight:900}.brand b{color:#176b4d}.wrap{max-width:950px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:18px;padding:22px;margin-bottom:18px}.badge{display:inline-block;padding:6px 10px;border-radius:99px;background:#eaf7f0;color:#176b4d;font-size:12px;font-weight:800}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.btn{border:0;background:#176b4d;color:#fff;font-weight:800;border-radius:10px;padding:11px 15px;cursor:pointer}.btn.alt{background:#eef4f1;color:#176b4d}.event{border-left:3px solid #176b4d;padding:8px 0 8px 14px;margin:12px 0}.muted{color:#68776f;font-size:13px}.form{display:flex;gap:9px}.form input{flex:1;padding:12px;border:1px solid #ccd8d2;border-radius:10px;font:inherit}@media(max-width:650px){.form{display:grid}}</style></head><body><header class="top"><div class="brand">Khara <b>Sauda</b></div><a href="deals.html">Deals</a></header><main class="wrap"><section class="panel" id="deal">Loading…</section><section class="panel"><h2>Update deal</h2><div class="actions"><button class="btn" onclick="change('negotiating')">Negotiating</button><button class="btn" onclick="change('accepted')">Accept</button><button class="btn" onclick="change('in_progress')">Start</button><button class="btn" onclick="change('completed')">Complete</button><button class="btn alt" onclick="change('cancelled')">Cancel</button></div><form class="form" id="noteForm"><input id="note" placeholder="Add a note to the deal history"><button class="btn">Add note</button></form><p id="status"></p></section><section class="panel"><h2>Deal history</h2><div id="history">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>let client,user,d;const id=new URLSearchParams(location.search).get('id');async function init(){client=await loadSupabase();if(!client)return;const s=await client.auth.getUser();user=s.data.user;if(!user){location.href='index.html';return}await loadDeal();await loadHistory()}async function loadDeal(){const r=await client.from('deals').select('*').eq('id',id).single();if(r.error){deal.textContent=r.error.message;return}d=r.data;deal.innerHTML=`<h1>${d.title}</h1><span class="badge">${d.status}</span><h2>₹${Number(d.value||0).toLocaleString('en-IN')}</h2><p>${d.description||''}</p><p class="muted">Created ${new Date(d.created_at).toLocaleString('en-IN')}</p>`}async function change(to){const from=d.status;const {error}=await client.from('deals').update({status:to}).eq('id',id);if(error){status.textContent=error.message;return}await client.from('deal_events').insert({deal_id:id,actor_id:user.id,event_type:'status_change',from_status:from,to_status:to});status.textContent='Deal updated.';await loadDeal();loadHistory()}async function loadHistory(){const r=await client.from('deal_events').select('*').eq('deal_id',id).order('created_at');history.innerHTML=r.error?r.error.message:(r.data?.length?r.data.map(e=>`<div class="event"><strong>${e.event_type==='status_change'?`${e.from_status||'new'} → ${e.to_status}`:'Note'}</strong><p>${e.note||''}</p><span class="muted">${new Date(e.created_at).toLocaleString('en-IN')}</span></div>`).join(''):'No history yet.')}noteForm.onsubmit=async e=>{e.preventDefault();if(!note.value.trim())return;const {error}=await client.from('deal_events').insert({deal_id:id,actor_id:user.id,event_type:'note',note:note.value.trim()});status.textContent=error?error.message:'Note added.';if(!error){note.value='';loadHistory()}};init();</script></body></html>
